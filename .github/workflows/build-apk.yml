name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Web Project
        run: npm run build

      - name: Add / Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "debug.keystore not found. Generating a stable debug.keystore..."
            cd android
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -keystore app/debug.keystore \
              -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
            cd ..
            
            echo "Commiting and pushing debug.keystore back to the repository..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/debug.keystore
            git commit -m "chore: commit stable debug.keystore for permanent SHA-1"
            git push || echo "Git push failed, please make sure 'Read and write permissions' are enabled in Repo Settings > Actions > General > Workflow permissions"
          fi
          
          cd android
          echo "=== SHA-1 FINGERPRINT FOR GOOGLE CONSOLE ==="
          keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep SHA1 || true
          echo "============================================="
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabBook-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
