name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Deploy using Service Account
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}"
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SERVICE_ACCOUNT_KEY" > sa.json
          PROJECT_ID=$(node -e "try { const sa = JSON.parse(require('fs').readFileSync('sa.json', 'utf8')); console.log(sa.project_id || ''); } catch(e) { console.log(''); }")
          echo "Detected Project ID: $PROJECT_ID"
          
          SITE_NAME="${{ secrets.FIREBASE_SITE }}"
          export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa.json
          
          if [ -n "$SITE_NAME" ]; then
            echo "Deploying to specific site: $SITE_NAME"
            if [ -n "$PROJECT_ID" ]; then
              npx firebase-tools deploy --only hosting:$SITE_NAME --project "$PROJECT_ID" --non-interactive || npx firebase-tools deploy --only hosting --project "$PROJECT_ID" --non-interactive
            else
              npx firebase-tools deploy --only hosting:$SITE_NAME --non-interactive || npx firebase-tools deploy --only hosting --non-interactive
            fi
          else
            if [ -n "$PROJECT_ID" ]; then
              npx firebase-tools deploy --only hosting --project "$PROJECT_ID" --non-interactive
            else
              npx firebase-tools deploy --only hosting --non-interactive
            fi
          fi
          
          rm -f sa.json

      - name: Deploy via Firebase Token CLI
        if: "${{ secrets.FIREBASE_TOKEN != '' && secrets.FIREBASE_SERVICE_ACCOUNT == '' }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          ARGS="--only hosting --non-interactive --token $FIREBASE_TOKEN"
          if [ -n "$PROJECT_ID" ]; then
            ARGS="$ARGS --project $PROJECT_ID"
          fi
          npx firebase-tools deploy $ARGS

