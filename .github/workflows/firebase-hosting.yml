name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          SITE_NAME: ${{ secrets.FIREBASE_SITE || 'hisabbooks' }}
        run: |
          if [ -n "$SERVICE_ACCOUNT_KEY" ]; then
            echo "Using Firebase Service Account for deployment..."
            echo "$SERVICE_ACCOUNT_KEY" > sa.json
            
            DETECTED_PROJECT=$(node -e "try { const sa = JSON.parse(require('fs').readFileSync('sa.json', 'utf8')); console.log(sa.project_id || ''); } catch(e) { console.log(''); }")
            TARGET_PROJECT="${PROJECT_ID:-$DETECTED_PROJECT}"
            echo "Target Project ID: $TARGET_PROJECT"
            
            export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa.json
            
            if [ -n "$SITE_NAME" ]; then
              echo "Deploying to site: $SITE_NAME"
              npx firebase-tools deploy --only hosting:$SITE_NAME --project "$TARGET_PROJECT" --non-interactive || npx firebase-tools deploy --only hosting --project "$TARGET_PROJECT" --non-interactive
            else
              npx firebase-tools deploy --only hosting --project "$TARGET_PROJECT" --non-interactive
            fi
            
            rm -f sa.json
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "Using Firebase Token for deployment..."
            ARGS="--only hosting --non-interactive --token $FIREBASE_TOKEN"
            if [ -n "$PROJECT_ID" ]; then
              ARGS="$ARGS --project $PROJECT_ID"
            fi
            if [ -n "$SITE_NAME" ]; then
              npx firebase-tools deploy --only hosting:$SITE_NAME $ARGS || npx firebase-tools deploy $ARGS
            else
              npx firebase-tools deploy $ARGS
            fi
          else
            echo "Error: Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN found in GitHub Secrets."
            exit 1
          fi

