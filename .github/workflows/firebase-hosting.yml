name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Privacy Policy to Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
          target: '${{ secrets.FIREBASE_TARGET_SITE || secrets.FIREBASE_SITE }}'
        continue-on-error: true

      - name: Fallback Deploy using Firebase CLI (Token based)
        if: env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SITE: ${{ secrets.FIREBASE_SITE }}
        run: |
          if [ -n "$FIREBASE_SITE" ]; then
            npx firebase-tools deploy --only hosting:$FIREBASE_SITE --token "$FIREBASE_TOKEN"
          else
            npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"
          fi
